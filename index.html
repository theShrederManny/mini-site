<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой сайт со снеговиком</title>
    <style>
        <body>

    <div class="card">
        <div class="avatar">😈</div>
        <h1 id="main-title">HACKED ME</h1>
        
        <!-- Этот блок кода изначально пустой, в него JS будет дописывать строчки -->
        <pre id="terminal" style="color: #00ff00; text-align: left; font-family: monospace; font-size: 14px; margin-bottom: 20px;"></pre>
        
        <!-- Кнопка теперь вызывает функцию при клике (onclick) -->
        <a href="#" onclick="startHack(event)" class="btn">ЗАПУСТИТЬ ВЗЛОМ</a>
    </div>

    <!-- Зона JavaScript -->
    <script>
        // Это аналог массива (Array) в GDScript
        const phrases = [
            "[SYSTEM]: Подключение к прокси...",
            "[SYSTEM]: Обход брандмауэра...",
            "[ERROR]: Доступ заблокирован...",
            "[SYSTEM]: Подбор ключей шифрования...",
            "[SUCCESS]: Доступ получен! Вы внутри."
        ];

        let currentLine = 0;

        // Это функция, аналог func startHack() в GDScript
        function startHack(event) {
            event.preventDefault(); // Запрещаем ссылке перезагружать страницу
            
            // Находим наш пустой блок <pre> по его ID (как get_node() или $Terminal в Godot)
            const terminal = document.getElementById("terminal");
            const title = document.getElementById("main-title");

            if (currentLine < phrases.length) {
                // Дописываем строчку текста и перенос строки (\n)
                terminal.innerText += phrases[currentLine] + "\n";
                currentLine++;
            } else {
                // Если строчки закончились, меняем заголовок (как title.text = "...")
                title.innerText = "СИСТЕМА ВЗЛОМАНА";
                title.style.color = "#ff0000"; // Меняем цвет на красный
            }
        }
    </script>

</body>
; /* Цвет кнопки при наведении пальцем или мышкой */
        }


    <div class="card">
        <div class="avatar">😈</div>
        <h1>HACKED ME</h1>
        <p>#$£&@#*</p>
        <a href="https://github.com" target="_blank" class="btn">HACK ME</a>
    </div>

</body>
</html>
