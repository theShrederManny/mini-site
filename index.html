<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HACKED ME</title>
    <style>
        /* CSS-Купец наводит хакерский стиль */
        body {
            font-family: 'Courier New', monospace;
            background-color: #050505; /* Почти полностью чёрный фон */
            color: #00ff00;            /* Ярко-зелёный хакерский текст */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #111111;      /* Чёрная карточка чуть светлее фона */
            padding: 30px;
            border-radius: 10px;       /* Сделали углы более острыми */
            border: 1px solid #00ff00; /* Зелёная рамка вокруг карточки */
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2); /* Неоновое зелёное свечение */
            text-align: center;
            max-width: 400px;
            width: 90%;
            <pre id="terminal" style="color: #00ff00; text-align: left; font-size: 14px; margin-bottom: 20px; white-space: pre-wrap; animation: matrix-blink 1.5s infinite;"></pre>
            
        }
        .avatar {
            font-size: 50px;
            margin-bottom: 15px;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 26px;
            letter-spacing: 2px;
        }
        .static-text {
            color: #888888;
            font-size: 16px;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            background-color: transparent;
            color: #00ff00;
            text-decoration: none;
            padding: 12px 24px;
            border: 1px solid #00ff00;
            border-radius: 4px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background-color: #00ff00;
            color: #000000; /* При наведении кнопка заливается зелёным, а текст чернеет */
            box-shadow: 0 0 15px #00ff00;
        }
        /* Создаем указ для анимации: меняем прозрачность от 100% до 40% */
@keyframes matrix-blink {
    0% { opacity: 1; }
    50% { opacity: 0.4; }
    100% { opacity: 1; }
}
        
    </style>
</head>
<body>

    <!-- HTML-Работяга строит каркас сайта -->
    <div class="card">
        <div class="avatar">😈</div>
        <h1 id="main-title">HACKED ME</h1>
        
        <p class="static-text">#$£&@#*</p>
        
        <!-- Сюда Король-JS будет дописывать строчки лога -->
        <pre id="terminal" style="color: #00ff00; text-align: left; font-size: 14px; margin-bottom: 20px; white-space: pre-wrap;"></pre>
        
        <a href="#" onclick="startHack(event)" class="btn">ЗАПУСТИТЬ ВЗЛОМ</a>
    </div>

        <!-- JS-Король управляет логикой по таймеру -->
    <script>
        const phrases = [
            "[SYSTEM]: Подключение к прокси...",
            "[SYSTEM]: Обход брандмауэра...",
            "[ERROR]: Доступ заблокирован...",
            "[SYSTEM]: Подбор ключей шифрования...",
            "[SUCCESS]: Доступ получен! Вы внутри."
        ];

        let currentLine = 0;
        let timer = null; // Переменная, где будет храниться наш запущенный таймер

        function startHack(event) {
            event.preventDefault(); 
            
            // Если таймер уже запущен, второй раз нажимать не даем
            if (timer !== null) return;

            const terminal = document.getElementById("terminal");
            const title = document.getElementById("main-title");
            const button = event.target; // Находим саму кнопку, на которую нажали

            button.innerText = "ИДЕТ ВЗЛОМ..."; // Меняем текст на кнопке
            button.style.borderColor = "#ffaa00"; // Делаем кнопку оранжевой на время процесса
            button.style.color = "#ffaa00";

            // Запускаем таймер: функция внутри будет выполняться каждые 1200 миллисекунд (1.2 секунды)
            timer = setInterval(function() {
                
                if (currentLine < phrases.length) {
                    // Печатаем текущую строку
                    terminal.innerText += phrases[currentLine] + "\n";
                    currentLine++;
                } else {
                    // Когда строки закончились, нужно ОСТАНОВИТЬ таймер, иначе он будет крутиться вечно
                    clearInterval(timer); 
                    
                    // Финальный аккорд: красим заголовок и кнопку в красный
                    title.innerText = "СИСТЕМА ВЗЛОМАНА";
                    title.style.color = "#ff0000"; 
                    title.style.textShadow = "0 0 10px #ff0000";

                    button.innerText = "ВЗЛОМАНО";
                    button.style.borderColor = "#ff0000";
                    button.style.color = "#ff0000";
                }

            }, 1200); // 1200 мс — скорость появления строчек. Можно поменять на 500 для быстрой печати!
        }
    </script>
    
</body>
</html>
