<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой первый сайт на GitHub</title>
    <style>
        /* Стили для красивого оформления сайта */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(45deg, #007bff, #00ff88);
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            color: white;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
            color: #111;
        }
        p {
            color: #666;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .btn {
            display: inline-block;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Круглая аватарка (пока просто эмодзи вместо картинки) -->
        <div class="avatar">☃️</div>
        
        <!-- Заголовок сайта -->
        <h1>Привет, мир!</h1>
        
        <!-- Описание -->
        <p>Это мой самый первый сайт, который я успешно запустил на бесплатном хостинге GitHub Pages. Теперь его может увидеть любой человек в интернете!</p>
        
        <!-- Кнопка со ссылкой -->
        <a href="https://github.com" target="_blank" class="btn">Открыть мой GitHub</a>
    </div>

</body>
</html>
