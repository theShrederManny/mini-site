<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HACKED ME</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background-color: #050505;
            color: #00ff00;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #111111;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #00ff00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .avatar {
            font-size: 50px;
            margin-bottom: 15px;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 26px;
            letter-spacing: 2px;
        }
        .static-text {
            color: #888888;
            font-size: 16px;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            background-color: transparent;
            color: #00ff00;
            text-decoration: none;
            padding: 12px 24px;
            border: 1px solid #00ff00;
            border-radius: 4px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background-color: #00ff00;
            color: #000000;
            box-shadow: 0 0 15px #00ff00;
        }

        /* КУПЕЦ: Создаем анимацию мерцания экрана */
        @keyframes matrix-blink {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Применяем мерцание к терминалу */
        #terminal {
            color: #00ff00; 
            text-align: left; 
            font-size: 14px; 
            margin-bottom: 20px; 
            white-space: pre-wrap; 
            animation: matrix-blink 2s infinite; /* Плавно мерцает каждые 2 секунды */
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">😈</div>
        <h1 id="main-title">HACKED ME</h1>
        
        <p class="static-text">#$£&@#*</p>
        
        <!-- Терминал теперь оформлен через CSS выше -->
        <pre id="terminal"></pre>
        
        <a href="#" onclick="startHack(event)" class="btn">ЗАПУСТИТЬ ВЗЛОМ</a>
    </div>

    <script>
        const phrases = [
            "[SYSTEM]: Подключение к прокси...",
            "[SYSTEM]: Обход брандмауэра...",
            "[ERROR]: Доступ заблокирован...",
            "[SYSTEM]: Подбор ключей шифрования...",
            "[SUCCESS]: Доступ получен! Вы внутри."
        ];

        let currentLine = 0;
        let timer = null; 

        function startHack(event) {
            event.preventDefault(); 
            
            if (timer !== null) return;

            const terminal = document.getElementById("terminal");
            const title = document.getElementById("main-title");
            const button = event.target; 

            button.innerText = "ИДЕТ ВЗЛОМ..."; 
            button.style.borderColor = "#ffaa00"; 
            button.style.color = "#ffaa00";

            timer = setInterval(function() {
                
                if (currentLine < phrases.length) {
                    terminal.innerText += phrases[currentLine] + "\n";
                    currentLine++;
                } else {
                    clearInterval(timer); 
                    
                    title.innerText = "СИСТЕМА ВЗЛОМАНА";
                    title.style.color = "#ff0000"; 
                    title.style.textShadow = "0 0 10px #ff0000";

                    button.innerText = "ВЗЛОМАНО";
                    button.style.borderColor = "#ff0000";
                    button.style.color = "#ff0000";
                }

            }, 1200); 
        }
    </script>

</body>
</html>
