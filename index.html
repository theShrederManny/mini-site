<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP8266 Deauther - Visual Simulator</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --panel-bg: #141414;
            --accent-color: #00ff66;
            --text-color: #ffffff;
            --text-muted: #888888;
            --danger-color: #ff3333;
            --warning-color: #ffaa00;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .dashboard {
            background-color: var(--panel-bg);
            border: 1px solid var(--accent-color);
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.1);
            width: 100%;
            max-width: 650px;
            border-radius: 8px;
            overflow: hidden;
            transition: border-color 0.3s ease;
        }
        .dashboard.attacking {
            border-color: var(--danger-color);
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.15);
        }
        .header {
            background-color: #1a1a1a;
            padding: 15px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.3s ease;
        }
        .dashboard.attacking .header h1 { color: var(--danger-color); }
        .status-badge {
            background-color: rgba(0, 255, 102, 0.1);
            color: var(--accent-color);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            border: 1px solid var(--accent-color);
            font-weight: bold;
        }
        .content { padding: 20px; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        button {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 10px 20px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            font-weight: bold;
        }
        button:hover:not(:disabled) {
            background-color: var(--accent-color);
            color: var(--bg-color);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
        }
        button:disabled { border-color: #333; color: var(--text-muted); cursor: not-allowed; }
        .btn-scan { flex: 2; }
        .btn-stop { 
            flex: 1; 
            border-color: var(--danger-color); 
            color: var(--danger-color);
            display: none;
        }
        .btn-stop:hover:not(:disabled) {
            background-color: var(--danger-color);
            color: var(--text-color);
            box-shadow: 0 0 10px rgba(255, 51, 51, 0.4);
        }
        .network-list {
            border: 1px solid #333;
            background-color: #0d0d0d;
            border-radius: 4px;
            max-height: 285px;
            overflow-y: auto;
        }
        .network-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 15px;
            border-bottom: 1px solid #222;
            align-items: center;
        }
        .network-item:last-child { border-bottom: none; }
        .network-info { display: flex; flex-direction: column; gap: 4px; }
        .ssid { font-weight: bold; }
        .mac { font-size: 0.75rem; color: var(--text-muted); }
        .network-right { display: flex; align-items: center; gap: 20px; }
        .signal { color: var(--accent-color); font-size: 0.9rem; width: 60px; text-align: right; }
        .btn-attack-sm {
            padding: 5px 10px;
            font-size: 0.75rem;
            border-color: var(--warning-color);
            color: var(--warning-color);
        }
        .btn-attack-sm:hover:not(:disabled) {
            background-color: var(--warning-color);
            color: var(--bg-color);
            box-shadow: 0 0 8px rgba(255, 170, 0, 0.4);
        }
        .stats-panel {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
            background: #1a1a1a;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #333;
            font-size: 0.8rem;
            text-align: center;
        }
        .stat-val { font-weight: bold; color: var(--danger-color); margin-top: 4px; }
        .terminal-log {
            margin-top: 20px;
            background-color: #000;
            border: 1px solid #222;
            padding: 10px;
            font-size: 0.8rem;
            color: #00ff00;
            height: 100px;
            overflow-y: auto;
            border-radius: 4px;
        }
        .log-entry { margin-bottom: 4px; line-height: 1.3; }
        .log-danger { color: var(--danger-color); }
        .log-warn { color: var(--warning-color); }
        .loader {
            display: none;
            text-align: center;
            padding: 30px;
            color: var(--warning-color);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="dashboard" id="mainDashboard">
    <div class="header">
        <h1>Deauther UI v3.0</h1>
        <div class="status-badge" id="status">READY</div>
    </div>
    
    <div class="content">
        <div class="controls">
            <button id="scanBtn" class="btn-scan">Сканировать эфир</button>
            <button id="stopBtn" class="btn-stop">Стоп атака</button>
        </div>

        <div class="loader" id="loader">СКАНИРОВАНИЕ ЧАСТОТ... ПОДОЖДИТЕ</div>

        <div class="network-list" id="networkList">
            <div style="padding: 30px; text-align: center; color: var(--text-muted);">
                Список пуст. Запустите сканирование.
            </div>
        </div>

        <div class="stats-panel" id="statsPanel">
            <div>Цель:<div class="stat-val" id="statTarget">-</div></div>
            <div>Отправлено пакетов:<div class="stat-val" id="statPkts">0</div></div>
            <div>Скорость:<div class="stat-val" id="statSpeed">0 пкт/с</div></div>
        </div>
<!-- Переключатель режимов -->
<div style="display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 15px;">
    <button id="tabDeauth" style="background: var(--accent-color); color: var(--bg-color);">Wi-Fi Deauther</button>
    <button id="tabDdos">Web DDoS Sim</button>
</div>

<!-- Блок DDoS атаки (по умолчанию скрыт) -->
<div id="ddosPanel" style="display: none; border: 1px solid #333; background: #0d0d0d; padding: 20px; border-radius: 4px; margin-bottom: 20px;">
    <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 8px; font-size: 0.85rem; color: var(--text-muted);">ЦЕЛЕВОЙ URL ИЛИ IP-АДРЕС:</label>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="targetUrl" value="https://example.com" style="flex: 1; background: #000; border: 1px solid var(--accent-color); color: #fff; padding: 10px; font-family: inherit; font-size: 0.9rem; outline: none;">
            <button id="startDdosBtn" style="border-color: var(--danger-color); color: var(--danger-color);">LAUNCH</button>
        </div>
    </div>
    
    <!-- График и статистика DDoS -->
    <div id="ddosStats" style="display: none; margin-top: 15px;">
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; font-size: 0.8rem; text-align: center; background: #1a1a1a; padding: 10px; border-radius: 4px; border: 1px solid #333; margin-bottom: 15px;">
            <div>Потоки (Threads):<div class="stat-val" style="color: var(--warning-color);">256 / 256</div></div>
            <div>Всего запросов:<div class="stat-val" id="ddosTotalReq" style="color: var(--danger-color);">0</div></div>
        </div>
        <!-- Фейковый индикатор полосы пропускания -->
        <div style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 5px; display: flex; justify-content: space-between;">
            <span>Ширина канала (Traffic Rate)</span>
            <span id="trafficRate">0 Gbps</span>
        </div>
        <div style="width: 100%; background: #222; height: 12px; border-radius: 2px; overflow: hidden; border: 1px solid #333;">
            <div id="trafficBar" style="width: 0%; height: 100%; background: linear-gradient(90deg, var(--warning-color), var(--danger-color)); transition: width 0.4s ease;"></div>
        </div>
    </div>
</div>
        
        <div class="terminal-log" id="terminalLog">
            <div class="log-entry">[SYSTEM] Симулятор интерфейса готов к работе.</div>
        </div>
    </div>
</div>
<script>
    const scanBtn = document.getElementById('scanBtn');
    const stopBtn = document.getElementById('stopBtn');
    const networkList = document.getElementById('networkList');
    const loader = document.getElementById('loader');
    const statusBadge = document.getElementById('status');
    const terminalLog = document.getElementById('terminalLog');
    const dashboard = document.getElementById('mainDashboard');
    
    const statsPanel = document.getElementById('statsPanel');
    const statTarget = document.getElementById('statTarget');
    const statPkts = document.getElementById('statPkts');
    const statSpeed = document.getElementById('statSpeed');

    let attackInterval = null;
    let packetCount = 0;
    let isAttacking = false;

    const mockNetworks = [
        { ssid: "Home_WiFi_2.4G", mac: "AA:BB:CC:11:22:33", rssi: "-45 dBm" },
        { ssid: "Keenetic-7741", mac: "11:22:33:44:55:66", rssi: "-62 dBm" },
        { ssid: "TP-Link_Guest", mac: "99:88:77:66:55:44", rssi: "-78 dBm" },
        { ssid: "iPhone_Hotspot", mac: "55:AA:55:AA:55:AA", rssi: "-31 dBm" },
        { ssid: "Free_Cafe_WiFi", mac: "00:11:22:33:44:55", rssi: "-85 dBm" }
    ];

    function log(message, type = '') {
        const entry = document.createElement('div');
        entry.className = 'log-entry ' + (type ? `log-${type}` : '');
        const time = new Date().toLocaleTimeString();
        entry.textContent = `[${time}] ${message}`;
        terminalLog.appendChild(entry);
        terminalLog.scrollTop = terminalLog.scrollHeight;
    }

    scanBtn.addEventListener('click', () => {
        if(isAttacking) return;
        scanBtn.disabled = true;
        networkList.style.display = 'none';
        loader.style.display = 'block';
        statsPanel.style.display = 'none';
        statusBadge.textContent = 'SCANNING';
        statusBadge.style.borderColor = 'var(--warning-color)';
        statusBadge.style.color = 'var(--warning-color)';
        log("Запуск пассивного сканирования каналов 1-13...");

        setTimeout(() => {
            loader.style.display = 'none';
            networkList.style.display = 'block';
            networkList.innerHTML = '';

            mockNetworks.forEach((net) => {
                const item = document.createElement('div');
                item.className = 'network-item';
                item.innerHTML = `
                    <div class="network-info">
                        <span class="ssid">${net.ssid}</span>
                        <span class="mac">BSSID: ${net.mac}</span>
                    </div>
                    <div class="network-right">
                        <div class="signal">${net.rssi}</div>
                        <button class="btn-attack-sm" data-ssid="${net.ssid}" data-mac="${net.mac}">DEAUTH</button>
                    </div>
                `;
                networkList.appendChild(item);
            });

            document.querySelectorAll('.btn-attack-sm').forEach(btn => {
                btn.addEventListener('click', function() {
                    startFakeAttack(this.getAttribute('data-ssid'), this.getAttribute('data-mac'));
                });
            });

            scanBtn.disabled = false;
            statusBadge.textContent = 'READY';
            statusBadge.style.borderColor = 'var(--accent-color)';
            statusBadge.style.color = 'var(--accent-color)';
            log(`Найдено беспроводных точек доступа: ${mockNetworks.length}`);
        }, 1500);
    });

    function startFakeAttack(ssid, mac) {
        if(isAttacking) return;
        isAttacking = true;
        packetCount = 0;
        dashboard.classList.add('attacking');
        scanBtn.style.display = 'none';
        stopBtn.style.display = 'block';
        statusBadge.textContent = 'ATTACKING';
        statusBadge.style.borderColor = 'var(--danger-color)';
        statusBadge.style.color = 'var(--danger-color)';
        document.querySelectorAll('.btn-attack-sm').forEach(btn => btn.disabled = true);
        statsPanel.style.display = 'grid';
        statTarget.textContent = ssid;
        statPkts.textContent = '0';
        statSpeed.textContent = '0 пкт/с';
        log(`Инициализация атаки деаутентификации на ${ssid} (${mac})...`, 'warn');

        attackInterval = setInterval(() => {
            const batch = Math.floor(Math.random() * 15) + 20;
            packetCount += batch;
            statPkts.textContent = packetCount;
            statSpeed.textContent = `${batch * 4} пкт/с`;
            const frameType = Math.random() > 0.5 ? 'Reason 1 (Unspecified)' : 'Reason 4 (Disassociated due to inactivity)';
            log(`[ATTACK] Отправлено ${batch} deauth-фреймов -> ${frameType}`, 'danger');
        }, 250);
    }

    function stopAttack() {
        if(!isAttacking) return;
        clearInterval(attackInterval);
        isAttacking = false;
        dashboard.classList.remove('attacking');
        scanBtn.style.display = 'block';
        stopBtn.style.display = 'none';
        statusBadge.textContent = 'READY';
        statusBadge.style.borderColor = 'var(--accent-color)';
        statusBadge.style.color = 'var(--accent-color)';
        document.querySelectorAll('.btn-attack-sm').forEach(btn => btn.disabled = false);
        log("Атака остановлена пользователем.");
    }

    stopBtn.addEventListener('click', stopAttack);
    // Логика переключения вкладок и DDoS симуляции
const tabDeauth = document.getElementById('tabDeauth');
const tabDdos = document.getElementById('tabDdos');
const ddosPanel = document.getElementById('ddosPanel');
const networkListWrapper = document.getElementById('networkList');
const controlsWrapper = document.querySelector('.controls');

const targetUrlInput = document.getElementById('targetUrl');
const startDdosBtn = document.getElementById('startDdosBtn');
const ddosStats = document.getElementById('ddosStats');
const ddosTotalReq = document.getElementById('ddosTotalReq');
const trafficRate = document.getElementById('trafficRate');
const trafficBar = document.getElementById('trafficBar');

let ddosInterval = null;
let ddosReqCount = 0;
let isDdosAttacking = false;

// Переключение на вкладку Deauth
tabDeauth.addEventListener('click', () => {
    if (isDdosAttacking || isAttacking) return;
    tabDeauth.style.background = 'var(--accent-color)';
    tabDeauth.style.color = 'var(--bg-color)';
    tabDdos.style.background = 'transparent';
    tabDdos.style.color = 'var(--accent-color)';
    
    networkListWrapper.style.display = 'block';
    controlsWrapper.style.display = 'flex';
    ddosPanel.style.display = 'none';
});

// Переключение на вкладку DDoS
tabDdos.addEventListener('click', () => {
    if (isDdosAttacking || isAttacking) return;
    tabDdos.style.background = 'var(--accent-color)';
    tabDdos.style.color = 'var(--bg-color)';
    tabDeauth.style.background = 'transparent';
    tabDeauth.style.color = 'var(--accent-color)';
    
    networkListWrapper.style.display = 'none';
    controlsWrapper.style.display = 'none';
    loader.style.display = 'none';
    statsPanel.style.display = 'none';
    ddosPanel.style.display = 'block';
});

// Запуск / Остановка фейковой DDoS атаки
startDdosBtn.addEventListener('click', () => {
    if (!isDdosAttacking) {
        // Старт атаки
        const rawUrl = targetUrlInput.value.trim() || "example.com";
        isDdosAttacking = true;
        ddosReqCount = 0;
        
        startDdosBtn.textContent = "STOP";
        targetUrlInput.disabled = true;
        ddosStats.style.display = 'block';
        
        statusBadge.textContent = 'DDOSING';
        statusBadge.style.borderColor = 'var(--danger-color)';
        statusBadge.style.color = 'var(--danger-color)';
        dashboard.classList.add('attacking');
        
        log(`[DDoS] Инициализация HTTP Flood атаки на цель: ${rawUrl}...`, 'warn');
        log(`[DDoS] Запуск асинхронных сокетов SYN/TCP...`, 'warn');
        
        ddosInterval = setInterval(() => {
            // Генерируем случайный всплеск запросов
            const batch = Math.floor(Math.random() * 450) + 800;
            ddosReqCount += batch;
            ddosTotalReq.textContent = ddosReqCount.toLocaleString();
            
            // Прыгающий фейковый трафик в гигабитах
            const currentGbps = (Math.random() * 12 + 84).toFixed(2);
            trafficRate.textContent = `${currentGbps} Gbps`;
            trafficBar.style.width = `${Math.floor(Math.random() * 15) + 80}%`;
            
            // Рандомные методы запросов для реалистичности лога
            const methods = ['GET', 'POST', 'HEAD'];
            const randomMethod = methods[Math.floor(Math.random() * methods.length)];
            log(`[FLOOD] ${randomMethod} запросы отправлены на ${rawUrl} (Пакет: +${batch})`, 'danger');
            
            // Имитируем падение сайта после накопления 15 000 запросов
            if (ddosReqCount > 15000 && ddosReqCount < 16500) {
                log(`[CRITICAL] Сервер ${rawUrl} перегружен! Получен код ответа: 502 Bad Gateway.`, 'warn');
                statusBadge.textContent = 'HOST_DOWN';
            }
        }, 300);
    } else {
        // Остановка атаки
        clearInterval(ddosInterval);
        isDdosAttacking = false;
        
        startDdosBtn.textContent = "LAUNCH";
        targetUrlInput.disabled = false;
        
        statusBadge.textContent = 'READY';
        statusBadge.style.borderColor = 'var(--accent-color)';
        statusBadge.style.color = 'var(--accent-color)';
        dashboard.classList.remove('attacking');
        
        trafficBar.style.width = '0%';
        trafficRate.textContent = '0 Gbps';
        
        log("[DDoS] Атака остановлена. Все потоки закрыты.");
    }
});
    
</script>
</body>
</html>
