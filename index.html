<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой сайт со снеговиком</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #0e1621; /* Глубокий темно-синий цвет фона (как в Telegram) */
            color: #f5f5f5;            /* Светлый цвет текста для хорошей читаемости */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #17212b;      /* Фон самой карточки чуть светлее общего фона */
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); /* Тень сделали более глубокой */
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(45deg, #00ff00, #00aa00); /* Градиент в синих тонах */
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 34px;
            color: #00ff00;           /* зеленый цвет для заголовка */
        }
        p {
            color: #00ff00;           /* Приглушенный серо-синий цвет для описания */
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .btn {
            display: inline-block;
            background-color: #00ff00; /* Фирменный синий цвет кнопки */
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        .btn:hover {
            background-color: #1a6fa8; /* Цвет кнопки при наведении пальцем или мышкой */
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">😈</div>
        <h1>HACKED ME</h1>
        <p>#$£&@#*</p>
        <a href="https://github.com" target="_blank" class="btn">HACK ME</a>
    </div>

</body>
</html>
